[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-risk-lab"
version = "0.1.0"
description = "Seeded Monte Carlo risk engine for synthetic carbon-credit portfolios"
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Nripanka Das"}]
dependencies = []

[project.urls]
Homepage = "https://github.com/nripankadas07/carbon-risk-lab"
Repository = "https://github.com/nripankadas07/carbon-risk-lab"
Issues = "https://github.com/nripankadas07/carbon-risk-lab/issues"

[project.scripts]
carbon-risk-lab = "carbon_risk_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
